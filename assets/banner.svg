<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow & Neon Shadows -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      .radar-sweep {
        transform-origin: 1050px 200px;
        animation: rotateSweep 10s linear infinite;
      }
      .pulse-node {
        animation: pulseGlow 3s ease-in-out infinite alternate;
      }
      .node-delay-1 {
        animation: pulseGlow 3.5s ease-in-out infinite alternate 0.5s;
      }
      .node-delay-2 {
        animation: pulseGlow 4s ease-in-out infinite alternate 1s;
      }
      .data-stream {
        stroke-dasharray: 8, 12;
        animation: streamFlow 25s linear infinite;
      }
      .orb-glow {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.85; transform: scale(1.02); }
      }
      @keyframes streamFlow {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatOrb {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-15px) translateX(10px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Cybernetic Grid Pattern in Background -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.45">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Dynamic Glowing Orbs in Background (Stay behind text) -->
  <g class="orb-glow" opacity="0.25">
    <circle cx="200" cy="80" r="140" fill="#7928ca" filter="url(#glow-purple)" />
    <circle cx="1020" cy="220" r="160" fill="#00f2fe" filter="url(#glow-cyan)" />
  </g>

  <!-- Background Animated Cyber Threat Radar & Nodes (Right Side behind foreground) -->
  <g opacity="0.75">
    <!-- Concentric Target Radar Rings -->
    <circle cx="1050" cy="200" r="150" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 6" />
    <circle cx="1050" cy="200" r="110" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.4" />
    <circle cx="1050" cy="200" r="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 4" opacity="0.6" />
    <circle cx="1050" cy="200" r="30" fill="none" stroke="#7928ca" stroke-width="1.5" opacity="0.8" />
    <circle cx="1050" cy="200" r="4" fill="#00f2fe" filter="url(#glow-cyan)" />

    <!-- Animated Radar Sweep -->
    <g class="radar-sweep">
      <path d="M 1050 200 L 1200 200 A 150 150 0 0 0 1156 94 Z" fill="url(#shield-grad)" opacity="0.22" />
      <line x1="1050" y1="200" x2="1200" y2="200" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)" />
    </g>

    <!-- Threat Topology Nodes (Animated Pulsing) -->
    <g class="data-stream" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4">
      <path d="M 920 120 L 980 160 L 1050 130 L 1120 180" />
      <path d="M 960 270 L 1020 240 L 1050 290 L 1140 260" />
    </g>

    <!-- Target Blips / Nodes -->
    <circle class="pulse-node" cx="980" cy="160" r="5" fill="#ff0080" filter="url(#glow-purple)" />
    <circle class="node-delay-1" cx="1120" cy="180" r="6" fill="#00f2fe" filter="url(#glow-cyan)" />
    <circle class="node-delay-2" cx="960" cy="270" r="4.5" fill="#38bdf8" filter="url(#glow-cyan)" />
    <circle class="pulse-node" cx="1050" cy="290" r="5.5" fill="#a855f7" filter="url(#glow-purple)" />
    <circle class="node-delay-1" cx="1140" cy="260" r="4" fill="#f43f5e" />
  </g>

  <!-- Foreground Content Block (High Contrast, crisp typography, perfectly legible) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="15" cy="15" r="5" fill="#00f2fe" filter="url(#glow-cyan)" />
      <text x="30" y="20" fill="#38bdf8" class="badge-text">🛡️ THREAT INTELLIGENCE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-size="46" class="title-text">
      Awesome <tspan fill="url(#accent-cyan)">Cybersecurity</tspan>
    </text>
    <text x="0" y="200" fill="url(#accent-purple)" font-size="44" class="title-text">
      Threat Intelligence
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="242" fill="#94a3b8" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400">
      Curated SaaS Platforms, Enterprise TIPs, Self-Hosted Stacks &amp; OSINT Frameworks
    </text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(0, 278)">
      <!-- Pill 1: STIX & TAXII -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="65" y="22" fill="#e2e8f0" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="600">⚡ STIX 2.1 / TAXII</text>
      </g>
      <!-- Pill 2: MITRE ATT&CK -->
      <g transform="translate(142, 0)">
        <rect width="145" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="72.5" y="22" fill="#e2e8f0" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="600">🎯 MITRE ATT&amp;CK</text>
      </g>
      <!-- Pill 3: IOC Enrichment -->
      <g transform="translate(299, 0)">
        <rect width="145" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="72.5" y="22" fill="#e2e8f0" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="600">🔍 IOC Enrichment</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(456, 0)">
        <rect width="130" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="65" y="22" fill="#e2e8f0" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="600">🌐 Open Source</text>
      </g>
    </g>

    <!-- Footer Meta Info -->
    <text x="0" y="348" fill="#64748b" font-size="13" font-family="monospace">
      &gt; MISP • OpenCTI • SpiderFoot • IntelOwl • CrowdStrike • Recorded Future
    </text>
  </g>

  <!-- High-tech Outer Border Glow -->
  <rect x="0.5" y="0.5" width="1199" height="399" fill="none" stroke="url(#accent-cyan)" stroke-width="1" opacity="0.3" />
</svg>